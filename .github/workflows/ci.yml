name: ci

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint
        run: python -m compileall api

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r api/requirements.txt pytest httpx

      - name: Run tests
        working-directory: api
        run: python -m pytest tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ACR
        run: echo "${{ secrets.ACR_TOKEN }}" | docker login ${{ vars.ACR_LOGIN_SERVER }} --username ${{ secrets.ACR_USER }} --password-stdin

      - name: Build and push image
        run: |
          docker build -t ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.NAMESPACE }}/shipwave-api:${{ github.sha }} api/
          docker push ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.NAMESPACE }}/shipwave-api:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          echo '${{ secrets.KUBECONFIG_B64 }}' | base64 --decode > kubeconfig
          chmod 600 kubeconfig

      - name: Deploy
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
        run: |
          helm upgrade --install shipwave-api helm/ -n ${{ vars.NAMESPACE }} --set image.repository=${{ vars.ACR_LOGIN_SERVER }}/${{ vars.NAMESPACE }}/shipwave-api --set image.tag=${{ github.sha }} --wait --timeout 3m